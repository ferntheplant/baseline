entry = [
  "src/index.{ts,tsx,js,jsx}",
  "src/main.{ts,tsx,js,jsx}",
  # Scripts invoked by the Vite Task runner (`command: "node scripts/smoke.ts"`) are never
  # imported, so they need an explicit entry root to stay reachable.
  "apps/*/scripts/*.ts",
  "scripts/*.{ts,mjs}",
]
dynamicallyLoaded = [
  # Files loaded at runtime with no static import: child-process spawns, filesystem-loaded
  # migrations, plugin directories a host discovers. Add an entry only for files that ARE
  # loaded at runtime; unreachable files are real dead code and should be deleted.
  "**/migrations/**",
]

[workspaces]
patterns = ["apps/*", "packages/*", "tools/*"]

[duplicates]
# Hide pair-only clones; focus on widespread copy-paste
# worth refactoring. Lower to 2 to report every duplicate pair.
minOccurrences = 3
ignore = [
  # Common additions:
  # "**/lib/**",          # for repos that publish transpiled output to lib/
  # "**/legacy/**",       # for repos with legacy-build artifacts
  # "**/generated/**"     # OpenAPI, Protobuf codegen
]

[rules]
unused-dependencies = "warn"

[[usedClassMembers]]
# `_tag` on a hand-rolled Error subclass is a nominal brand, not a runtime read.
# TypeScript is structurally typed, so without it error classes that declare no other
# member are mutually assignable and a bare `new Error()` satisfies all of them. Runtime
# discrimination is `instanceof`, so no code ever reads the field and fallow is right that
# nothing does; the value is in the type checker, not the program.
extends = "Error"
members = ["_tag"]
