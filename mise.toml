# Tools Vite+ does not provide, plus Node (BASELINE.md, _Prerequisites_, says why Node is here).
#
# The Node version is `.node-version`, the one file mise, Vite+, and CI's setup-vp all read.
# Keep it inside `engines.node`.
[settings]
idiomatic_version_file_enable_tools = ["node"]
# Vite+ owns pnpm, from `devEngines` in package.json. A pnpm in someone's global mise config
# would otherwise sit ahead of Vite+'s on PATH inside this repo; a pnpm 11 there crashes on
# pnpm 12's native binary when it switches to the pinned version.
disable_tools = ["pnpm"]

[tools]
# Exact, like every version in the workspace; taze bumps only what pnpm installs, so these move
# by hand.
gitleaks = "8.30.1"
# Exact: typos grows its dictionary in patch releases, so any float can fail CI on unchanged code.
typos = "1.50.3"
# Browser automation for agents; the `agent-browser` skill drives it and says how to set it up.
"npm:agent-browser" = "0.38.2"
